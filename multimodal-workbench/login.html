<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light"><title>登录 · 小小宇宙无敌</title><link rel="stylesheet" href="/login.css"></head>
<body>
<header class="login-header"><a class="login-brand" href="/login" aria-label="小小宇宙无敌"><span class="brand-symbol">宇<i>↗</i></span><span>小小宇宙无敌<small>多模态渠道测试台</small></span></a><span class="header-caption">MODEL TESTING STUDIO</span></header>
<main class="login-layout">
<section class="login-story" aria-label="工作台介绍"><p class="eyebrow"><i></i> A SPACE FOR YOUR MODELS</p><h1>连接模型。<br>留住每一次<span>发现。</span></h1><p class="story-description">从一次真实请求开始，<br>让文本、图像、视频与声音，都有迹可循。</p><div class="orbital" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div><div class="orbit-core">宇<span>↗</span></div><span class="orbit-point point-a">Aa<small>TEXT</small></span><span class="orbit-point point-b">▧<small>IMAGE</small></span><span class="orbit-point point-c">▷<small>VIDEO</small></span><span class="orbit-point point-d">≋<small>AUDIO</small></span><i class="orbit-dot dot-a"></i><i class="orbit-dot dot-b"></i></div><div class="story-footer"><span>01 — 连接与测试</span><span>02 — 回看与判断</span></div></section>
<section class="login-card" aria-labelledby="loginTitle"><div class="card-mark">YOUR WORKSPACE <span>↗</span></div><h2 id="loginTitle">欢迎回来</h2><p class="card-description">登录，继续你的模型测试。</p><form id="loginForm" method="post" action="/api/auth/login"><label for="username">账号 <span>ACCOUNT</span></label><input id="username" name="username" autocomplete="username" required spellcheck="false" placeholder="输入工作台账号"><label for="password">密码 <span>PASSWORD</span></label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="输入登录密码"><button id="togglePassword" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div><p id="loginMessage" class="login-message" role="alert" hidden></p><button id="loginSubmit" class="login-submit" type="submit"><span>进入工作台</span><span class="submit-arrow">↗</span></button></form><div class="login-note"><span class="note-dot"></span><p>你的测试与历史记录，<br>都在同一个工作台。</p><span class="note-lines" aria-hidden="true">≋</span></div></section>
</main><footer class="login-footer"><span>小小宇宙无敌 / MULTIMODAL WORKBENCH</span><span>v1.11</span></footer><script src="/login.js"></script>
</body></html>
